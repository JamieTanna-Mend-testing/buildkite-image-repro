# https://github.com/buildkite-plugins/github-actions-buildkite-plugin
# `runners` is an array of `{runs-on, queue, image?}` objects. An explicit
# `image` only applies to the matching Linux x86-64 label and must be an
# immutable `@sha256:` reference.
steps:
  - command: "run workflow"
    plugins:
      - github-actions#v1.0.0:
          workflow: ".github/workflows/ci.yml"
          runners:
            - runs-on: ubuntu-latest
              queue: hosted
              image: "buildkite.namespace-images.com/agent-base@sha256:62a45683afffaae9edfd669c16d2fee23b5a571679f31715e1063dada667ea24"
            - runs-on: macos-14
              queue: macos-sonoma-arm64
